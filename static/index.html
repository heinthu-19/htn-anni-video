<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>htn anni video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Padauk', 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#0B0F19] text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-[#111827]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
                    H
                </div>
                <span class="font-bold text-lg tracking-wide text-white">htn anni video</span>
            </div>
            <span class="text-xs font-semibold px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">
                8s Scene Engine
            </span>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-4xl mx-auto px-6 py-10 w-full flex-grow">
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">htn anni video စတူဒီယို</h1>
            <p class="text-sm text-slate-400">Character ပုံနှင့် Prompt ထည့်သွင်းပြီး မြန်မာစကားပြော ၂-၅ မိနစ် ဗီဒီယို ဖန်တီးပါ</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            <div class="bg-[#111827] border border-slate-800 p-6 rounded-2xl shadow-xl">
                <form id="videoForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Main Character ပုံ ထည့်ပါ (Face Photo)</label>
                        <input type="file" id="char_image" accept="image/*" required
                               class="w-full bg-[#1A2234] border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-600 file:text-white">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Character ဖော်ပြချက် (Optional)</label>
                        <input type="text" id="char_desc" placeholder="ဥပမာ- မျက်မှန်တပ်ထားသော ဆံပင်အနက်ရောင် ကောင်လေး"
                               class="w-full bg-[#1A2234] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">ဇာတ်လမ်း Prompt (Story)</label>
                        <textarea id="story_prompt" rows="5" required placeholder="ဥပမာ- မှော်ကျောင်းတော်တွင် အားနည်းခဲ့သော်လည်း အမှန်တကယ်တွင် အင်အားကြီးသော နတ်ဆိုးစနစ်ပိုင်ရှင် ဖြစ်လာပုံ..."
                                  class="w-full bg-[#1A2234] border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-indigo-500"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">မြန်မာအသံထွက်</label>
                        <select id="voice_gender" class="w-full bg-[#1A2234] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                            <option value="male">ယောကျ်ားလေးအသံ (Thiha)</option>
                            <option value="female">မိန်းကလေးအသံ (Nilar)</option>
                        </select>
                    </div>

                    <button type="submit" id="btnSubmit" 
                            class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-indigo-600/30">
                        ဗီဒီယို စတင်ထုတ်လုပ်မည်
                    </button>
                </form>
            </div>

            <!-- Preview -->
            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 shadow-xl min-h-[360px] flex flex-col justify-center items-center text-center">
                <div id="stateIdle" class="space-y-3">
                    <div class="w-16 h-16 rounded-full bg-slate-800/80 border border-slate-700 flex items-center justify-center mx-auto text-2xl">🎬</div>
                    <h3 class="text-base font-semibold text-white">အသင့်ရှိနေပါသည်</h3>
                    <p class="text-xs text-slate-400 max-w-xs">Character ပုံနှင့် Prompt ထည့်သွင်းပြီး စတင်ပါ</p>
                </div>

                <div id="stateProcessing" class="hidden w-full space-y-4">
                    <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <div>
                        <h4 class="text-sm font-bold text-white mb-1" id="procTitle">လုပ်ဆောင်နေပါသည်...</h4>
                        <p class="text-xs text-indigo-400" id="procMsg">စတင်နေပါသည်</p>
                    </div>
                </div>

                <div id="stateCompleted" class="hidden flex flex-col items-center w-full">
                    <video id="resVideo" controls class="w-[200px] h-[340px] rounded-xl object-cover border border-slate-700 mb-3"></video>
                    <a id="dlLink" download="anni_video.mp4" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold text-white shadow-lg transition">
                        ဗီဒီယို ဒေါင်းလုဒ်ဆွဲမည် (.mp4)
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
        htn anni video
    </footer>

    <script>
        let pollTimer = null;
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('char_image', document.getElementById('char_image').files[0]);
            fd.append('char_desc', document.getElementById('char_desc').value);
            fd.append('story_prompt', document.getElementById('story_prompt').value);
            fd.append('voice_gender', document.getElementById('voice_gender').value);

            document.getElementById('stateIdle').classList.add('hidden');
            document.getElementById('stateProcessing').classList.remove('hidden');
            document.getElementById('stateCompleted').classList.add('hidden');
            document.getElementById('btnSubmit').disabled = true;

            try {
                const res = await fetch('/api/create-video', { method: 'POST', body: fd });
                const data = await res.json();

                pollTimer = setInterval(async () => {
                    const sRes = await fetch(`/api/task/${data.task_id}`);
                    const sData = await sRes.json();
                    
                    document.getElementById('procMsg').innerText = sData.message;
                    if(sData.title) document.getElementById('procTitle').innerText = sData.title;

                    if (sData.status === 'completed') {
                        clearInterval(pollTimer);
                        document.getElementById('stateProcessing').classList.add('hidden');
                        document.getElementById('stateCompleted').classList.remove('hidden');
                        document.getElementById('resVideo').src = sData.result_url;
                        document.getElementById('dlLink').href = sData.result_url;
                        document.getElementById('btnSubmit').disabled = false;
                    } else if (sData.status === 'failed') {
                        clearInterval(pollTimer);
                        alert("Error: " + sData.message);
                        location.reload();
                    }
                }, 3000);
            } catch (err) {
                alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ");
                location.reload();
            }
        });
    </script>
</body>
  </html>
